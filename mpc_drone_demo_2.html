<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MPC Gain Tuning Demo</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f4f4f4;
}

.container{
    display:flex;
    gap:20px;
}

.controls{
    width:250px;
    background:white;
    padding:15px;
    border-radius:10px;
}

.sim{
    flex:1;
    background:white;
    padding:15px;
    border-radius:10px;
}

label{
    display:block;
    margin-top:15px;
}

canvas{
    border:1px solid black;
    background:white;
}

.value{
    font-weight:bold;
    color:#1565c0;
}
</style>
</head>

<body>

<h1>Interactive MPC Gain Tuning Demo</h1>

<div class="container">

<div class="controls">

<h3>Controller Settings</h3>

<label>
Position Weight Q:
<span id="qVal" class="value">10</span>
</label>
<input type="range" id="Q" min="1" max="100" value="10">

<label>
Velocity Weight Qv:
<span id="qvVal" class="value">1</span>
</label>
<input type="range" id="Qv" min="1" max="50" value="1">

<label>
Control Weight R:
<span id="rVal" class="value">1</span>
</label>
<input type="range" id="R" min="1" max="50" value="1">

<label>
Prediction Horizon:
<span id="nVal" class="value">15</span>
</label>
<input type="range" id="N" min="5" max="40" value="15">

<br><br>

<button onclick="resetSim()">Reset</button>
<button onclick="disturb()">Disturbance</button>

<hr>

<p><b>Current Position:</b> <span id="posText">0</span></p>
<p><b>Current Velocity:</b> <span id="velText">0</span></p>
<p><b>Control Input:</b> <span id="uText">0</span></p>

</div>

<div class="sim">
<canvas id="canvas" width="800" height="500"></canvas>
</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let x = 0;
let v = 0;

const target = 10;
const dt = 0.1;

let lastU = 0;

let positionHistory = [];
const maxHistory = 300;

const qSlider = document.getElementById("Q");
const qvSlider = document.getElementById("Qv");
const rSlider = document.getElementById("R");
const nSlider = document.getElementById("N");

function updateLabels(){
    qVal.textContent = qSlider.value;
    qvVal.textContent = qvSlider.value;
    rVal.textContent = rSlider.value;
    nVal.textContent = nSlider.value;
}

qSlider.oninput = updateLabels;
qvSlider.oninput = updateLabels;
rSlider.oninput = updateLabels;
nSlider.oninput = updateLabels;

updateLabels();

function resetSim(){
    x = 0;
    v = 0;
    lastU = 0;
    positionHistory = [];
}

function disturb(){
    v += 3;
}

function computeMPC(){

    const Q = Number(qSlider.value);
    const Qv = Number(qvSlider.value);
    const R = Number(rSlider.value);
    const N = Number(nSlider.value);

    let bestCost = Infinity;
    let bestU = 0;

    for(let u=-5; u<=5; u+=0.2){

        let xp = x;
        let vp = v;
        let cost = 0;

        for(let k=0; k<N; k++){

            xp += vp * dt;
            vp += u * dt;

            cost +=
                Q * Math.pow(target - xp,2)
                + Qv * Math.pow(vp,2)
                + R * Math.pow(u,2);

        }

        if(cost < bestCost){
            bestCost = cost;
            bestU = u;
        }
    }

    return bestU;
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    //---------------------------------------
    // TOP: CART SIMULATION
    //---------------------------------------

    const start = 50;
    const end = 750;

    ctx.strokeStyle = "black";

    ctx.beginPath();
    ctx.moveTo(start,125);
    ctx.lineTo(end,125);
    ctx.stroke();

    const targetPixel =
        start + (target / 12) * (end - start);

    ctx.strokeStyle = "red";

    ctx.beginPath();
    ctx.moveTo(targetPixel,90);
    ctx.lineTo(targetPixel,160);
    ctx.stroke();

    ctx.fillStyle = "red";
    ctx.fillText("Target", targetPixel - 15, 80);

    const cartPixel =
        start + (x / 12) * (end - start);

    ctx.fillStyle = "dodgerblue";

    ctx.beginPath();
    ctx.arc(cartPixel,125,15,0,Math.PI*2);
    ctx.fill();

    ctx.fillText("Cart", cartPixel - 10,160);

    //---------------------------------------
    // BOTTOM: POSITION GRAPH
    //---------------------------------------

    const graphX = 50;
    const graphY = 280;
    const graphWidth = 700;
    const graphHeight = 180;

    ctx.strokeStyle = "black";
    ctx.strokeRect(graphX, graphY,
                   graphWidth, graphHeight);

    ctx.fillStyle = "black";
    ctx.fillText(
        "Position vs Time",
        graphX + 5,
        graphY - 10
    );

    const targetY =
        graphY +
        graphHeight -
        (target / 12) * graphHeight;

    ctx.strokeStyle = "red";

    ctx.beginPath();
    ctx.moveTo(graphX,targetY);
    ctx.lineTo(graphX + graphWidth,targetY);
    ctx.stroke();

    ctx.fillStyle = "red";
    ctx.fillText(
        "Target Position",
        graphX + graphWidth - 100,
        targetY - 5
    );

    ctx.strokeStyle = "dodgerblue";
    ctx.beginPath();

    for(let i=0; i<positionHistory.length; i++){

        const px =
            graphX +
            (i / maxHistory) * graphWidth;

        const clippedPos =
            Math.max(
                0,
                Math.min(12, positionHistory[i])
            );

        const py =
            graphY +
            graphHeight -
            (clippedPos / 12) * graphHeight;

        if(i===0){
            ctx.moveTo(px,py);
        }
        else{
            ctx.lineTo(px,py);
        }
    }

    ctx.stroke();

    //---------------------------------------
    // READOUTS
    //---------------------------------------

    document.getElementById("posText")
        .textContent = x.toFixed(2);

    document.getElementById("velText")
        .textContent = v.toFixed(2);

    document.getElementById("uText")
        .textContent = lastU.toFixed(2);
}

function update(){

    const u = computeMPC();

    lastU = u;

    v += u * dt;
    x += v * dt;

    positionHistory.push(x);

    if(positionHistory.length > maxHistory){
        positionHistory.shift();
    }

    draw();
}

setInterval(update,50);

</script>

</body>
</html>
